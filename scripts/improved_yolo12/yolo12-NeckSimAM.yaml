# YOLOv12 🚀, AGPL-3.0 license
# YOLOv12-NeckSimAM：在 YOLOv12 颈部三个输出层（P3/P4/P5）之后各插入一个 SimAM 无参注意力模块。
# SimAM 输入输出通道/空间尺寸一致，即插即用；无可学习参数，故参数量/GFLOPs 与 baseline 相同，仅多 3 个层。

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n.yaml' will call yolov12.yaml with scale 'n'
  # [depth, width, max_channels]
  # 以下 summary 为 nc=1、imgsz=640 的实测值
  n: [0.50, 0.25, 1024] # summary: 275 layers, 2,568,243 parameters, 2,568,227 gradients, 6.5 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 275 layers, 9,253,523 parameters, 9,253,507 gradients, 21.5 GFLOPs
  m: [0.50, 1.00, 512] # summary: 295 layers, 20,138,259 parameters, 20,138,243 gradients, 67.7 GFLOPs
  l: [1.00, 1.00, 512] # summary: 491 layers, 26,389,875 parameters, 26,389,859 gradients, 89.4 GFLOPs
  x: [1.00, 1.50, 512] # summary: 491 layers, 59,119,539 parameters, 59,119,523 gradients, 199.8 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)

  # @TODO 20260902 对颈部三个输出各接一个 SimAM 注意力（parse_model 走 base_model 分支注入通道，yaml 传输入通道数）
  - [14, 1, SimAM, [256]] # 21 SimAM(P3/8-small)
  - [17, 1, SimAM, [512]] # 22 SimAM(P4/16-medium)
  - [20, 1, SimAM, [1024]] # 23 SimAM(P5/32-large)

  - [[21, 22, 23], 1, Detect, [nc]] # Detect(P3, P4, P5) args: [nc]
