# YOLO12s-FreqFusion_hrup：HR 引导双输入即插即用 FreqFusion 上采样器。
# 设计动机：结构重构版（yolo12-FreqFusion.yaml）前置 3 个 1x1 Conv 拉齐通道，层索引
# 9-21 偏移导致 head 无法迁移 yolo12s.pt 预训练权重；单输入版（yolo12s-FreqFusion_up.yaml）
# 的 HR 流由 LR 自身 nearest 2x 合成，丢失原始设计"HR 来自主干高分辨率特征"的优势。
# 本方案用 FreqFusionHRUp（双输入适配器，位于 AddModules/FreqFusion.py）原位替换官方
# head 第 9/12 层的 nn.Upsample：HR 流真实来自主干跳连（层 6=P4、层 4=P3），LR 流来自
# 前序层，适配器内置 1x1 Conv 将 HR 投影到 LR 通道后交 FreqFusion 做 AHPF 高频增强 +
# ALPF 抗混叠上采样。输出 = ALPF_up(LR) + align(HR) + HP(align(HR))，通道 = LR 通道、
# 空间 = HR 分辨率，与 nn.Upsample(scale=2) 张量形状完全一致；Concat 及其余 head 层与
# 官方 yolo12.yaml 逐行相同，层索引 9-21 对齐，yolo12s.pt 预训练迁移率与 DySample/
# FreqFusion_up 版一致（model.9/12 为新参数、ckpt 中 Upsample 无参数，其余全部加载）。
# 与 FreqFusion_up（HR 合成）构成"HR 来源"单一变量的对照实验。
# 注意：文件名必须携带 scale 字母（yolo12s-*），否则 parse_model 会静默按 n 缩放构建。

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n.yaml' will call yolov12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12 backbone（与官方 yolo12.yaml 完全一致）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12s-FreqFusion_hrup head（仅第 9/12 层替换 Upsample，其余与官方逐行相同）
head:
  - [[6, -1], 1, FreqFusionHRUp, []] # 9 FreqFusion_hrup(P5)：HR=backbone P4(256ch), LR=P5(512ch) → 512ch@P4，替代 Upsample
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4（与官方一致，768ch）
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [[4, -1], 1, FreqFusionHRUp, []] # 12 FreqFusion_hrup(P4)：HR=backbone P3(256ch), LR=head P4(256ch) → 256ch@P3（等通道，align 退化 Identity）
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3（与官方一致，512ch）
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]] # 21 Detect(P3, P4, P5)
