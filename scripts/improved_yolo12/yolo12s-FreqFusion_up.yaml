# YOLOv12 🚀, AGPL-3.0 license
# YOLO12s-FreqFusion_up：FreqFusion 即插即用上采样器（类 DySample 集成方式）。
# FreqFusionUpsample（单输入适配器，位于 AddModules/FreqFusion.py）放在官方 head 原
# nn.Upsample 的位置（第 9/12 层）：hr 流由 nearest 2x 初始上采样合成（与原 Upsample 行为
# 一致），再经 FreqFusion 做 AHPF 高频增强 + ALPF 抗混叠上采样，输出 = HP(nearest_up(x))
# + ALPF_up(x)，通道不变、空间 x2，与 nn.Upsample(scale=2) 张量形状完全一致；Concat 及
# 其余 head 层与官方 yolo12.yaml 逐行相同，层索引 9-21 对齐，yolo12s.pt 预训练迁移率与
# DySample 版一致（model.9/12 为新参数、ckpt 中 Upsample 无参数，其余全部加载）。
# 与 DySample 构成同位上采样算子的公平对比。
# 注意：文件名必须携带 scale 字母（yolo12s-*），否则 parse_model 会静默按 n 缩放构建。

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n.yaml' will call yolov12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12 backbone（与官方 yolo12.yaml 完全一致）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12s-FreqFusion_up head（仅第 9/12 层替换 Upsample，其余与官方一致）
head:
  - [-1, 1, FreqFusionUpsample, []] # 9 FreqFusion_up(P5)：替代 Upsample
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, FreqFusionUpsample, []] # 12 FreqFusion_up(P4)
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]] # 21 Detect(P3, P4, P5)
