# YOLOv12 🚀, AGPL-3.0 license
# YOLO12s-FreqFusion：以 FreqFusion（TPAMI 2024 频率感知特征融合）替代 head 自顶向下
# 路径中的 Upsample+Concat。基线 yolo12s；head 中 A2C2f/C3k2 参数与官方 yolo12.yaml
# 对齐，FreqFusion 为唯一改进变量；backbone 与官方完全一致（yolo12s.pt 的 backbone
# 权重可迁移，head 重构后全新初始化属预期行为）。
# 注意：文件名必须携带 scale 字母（yolo12s-*），否则 parse_model 会静默按 n 缩放构建。

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n.yaml' will call yolov12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12 backbone（与官方 yolo12.yaml 完全一致）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12s-FreqFusion head
head:
  - [4, 1, Conv, [256]] # 9-P3/8（1x1 横向压缩）
  - [6, 1, Conv, [256]] # 10-P4/16
  - [8, 1, Conv, [256]] # 11-P5/32

  - [[10, -1], 1, FreqFusion, []] # 12 FreqFusion(P4-HR, P5-LR)，替代 Upsample+Concat
  - [-1, 2, A2C2f, [256, False, -1]] # 13

  - [[9, -1], 1, FreqFusion, []] # 14 FreqFusion(P3-HR, P4-LR)
  - [-1, 2, A2C2f, [256, False, -1]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5（横向输入为 1x1 压缩后的 P5）
  - [-1, 2, C3k2, [1024, True]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
